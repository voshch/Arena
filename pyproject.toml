[tool.uv]
package = false
default-groups = ["dev", "arena_humansim", "arena_text_crowd", "arena_hunav_sim_bridge", "tf_transformations"]

[tool.uv.workspace]
members = [
    "_meta/arena_cli",
    "arena_bringup",
    "arena_mujoco/arena_mujoco",
    "arena_runtime/arena_runtime",
    "arena_simulation_setup/src",
    "task_generator",
    "utils/arena_cam",
    "utils/arena_rclpy_mixins",
    "utils/arena_viz",
    "utils/human_steering",
    "utils/rerun_utils",
    "utils/rviz_utils",
    "utils/task_generator_mcp",
]

[tool.pytest.ini_options]
norecursedirs = ["deps", ".git", ".venv", "build", "install", "log", "_meta"]
addopts = "-ra --strict-markers --import-mode=importlib"

[project]
name = "arena-rosnav"
version = "0.1.0"
description = ""
authors = [{ name = "Volodymyr Shcherbyna", email = "dev@voshch.dev" }]
maintainers = [{ name = "Volodymyr Shcherbyna", email = "dev@voshch.dev" }]
requires-python = "==3.12.*"
dependencies = [
    "pip",
    "colcon-common-extensions",
    "lark",
    "rosdep",
    "PyYAML",
    "empy<4",
    "setuptools>=61,<80",
    "huggingface_hub",
    "opencv-python",
]

[build-system]
requires = ["setuptools<80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]
arena_humansim = [
    "attrs",
    "cattrs",
    "matplotlib",
    "numpy",
    "pandas",
    "py-trees>=2.4.0",
    "pyastar2d>=1.1.4",
    "pyyaml",
    "rosbags",
    "scipy",
    "torch-geometric>=2.8.0.post1",
    "tqdm",
]
arena_text_crowd = [
    "diffusers>=0.37.1",
    "pyglet>=2.1.14",
    "rasterio>=1.5.0",
]
arena_hunav_sim_bridge = [
    "pathfinding3d>=0.7.2",
]
tf_transformations = [
    "transforms3d",
]

[tool.ruff]
target-version = "py312"
line-length = 320
src = [
    "arena_runtime/arena_runtime/arena_runtime",
    "task_generator/task_generator",
    "arena_bringup/arena_bringup",
    "arena_robots/arena_robots/arena_robots",
    "arena_simulation_setup/src/arena_simulation_setup",
    "utils/arena_rclpy_mixins/arena_rclpy_mixins",
    "utils/rviz_utils/rviz_utils",
    "utils/human_steering/human_steering",
    "utils/arena_cam/arena_cam",
]
extend-exclude = [
    "arena_tools",
    "arena_robots/deps",
    "arena_planners/planners",
    ".venv",
    "**/launch",
    "**/*.launch.py",
    "**/scripts",
    "**/setup.py",
]

[tool.ruff.lint]
exclude = [
    "**/tests/**",
    "**/test/**",
]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI"]
ignore = ["E501", "E402", "F841", "E731", "PYI051", "E741", "UP035"]

[tool.ruff.lint.isort]
known-first-party = [
    "arena_auditory",
    "arena_cli",
    "arena_evaluation",
    "arena_hearing",
    "arena_isaac",
    "arena_training",
    "isaac_utils",
]

[tool.ruff.lint.per-file-ignores]
"arena_simulation_setup/**/*.py" = ["UP"]
"utils/arena_rclpy_mixins/**/*.py" = ["UP046", "UP047"]
"_meta/arena_cli/__main__.py" = ["UP036"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
