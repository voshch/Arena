[tool.uv]
package = false
default-groups = ["dev", "arena_humansim", "arena_text_crowd", "arena_hunav_sim_bridge", "tf_transformations"]

[tool.uv.workspace]
members = [
    "_meta/arena_cli",
    "arena_bringup",
    "arena_mcp",
    "arena_runtime/arena_runtime",
    "arena_simulation_setup/src",
    "task_generator",
    "utils/arena_cam",
    "utils/arena_rclpy_mixins",
    "utils/arena_viz",
    "utils/human_steering",
    "utils/rerun_utils",
    "utils/rviz_utils",
]

[tool.pytest.ini_options]
norecursedirs = ["deps", ".git", ".venv", "build", "install", "log", "_meta"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["network: hits the live upstream host"]

[project]
name = "arena-rosnav"
version = "0.1.0"
description = ""
authors = [{ name = "Volodymyr Shcherbyna", email = "dev@voshch.dev" }]
maintainers = [{ name = "Volodymyr Shcherbyna", email = "dev@voshch.dev" }]
requires-python = "==3.12.*"
dependencies = [
    "pip",
    "colcon-common-extensions",
    "lark",
    "rosdep",
    "PyYAML",
    "empy<4",
    "setuptools>=61,<80",
    "huggingface_hub",
    "opencv-python",
]

[build-system]
requires = ["setuptools<80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]
arena_humansim = [
    "attrs",
    "cattrs",
    "gymnasium",
    "matplotlib",
    "numpy",
    "pandas",
    "py-trees>=2.4.0",
    "pyastar2d>=1.1.4",
    "pyyaml",
    "rosbags",
    "scipy",
    "stable-baselines3",
    "torch-geometric>=2.8.0.post1",
    "tqdm",
]
arena_text_crowd = [
    "diffusers>=0.37.1",
    "pyglet>=2.1.14",
    "rasterio>=1.5.0",
]
arena_hunav_sim_bridge = [
    "pathfinding3d>=0.7.2",
]
tf_transformations = [
    "transforms3d",
]

[tool.ruff]
target-version = "py312"
line-length = 320
src = [
    "arena_mcp",
    "arena_runtime/arena_runtime/arena_runtime",
    "task_generator/task_generator",
    "arena_bringup/arena_bringup",
    "arena_robots/arena_robots/arena_robots",
    "arena_simulation_setup/src/arena_simulation_setup",
    "utils/arena_rclpy_mixins/arena_rclpy_mixins",
    "utils/rviz_utils/rviz_utils",
    "utils/human_steering/human_steering",
    "utils/arena_cam/arena_cam",
]
extend-exclude = [
    "arena_tools",
    "arena_robots/deps",
    "arena_planners/planners",
    ".venv",
    "**/launch",
    "**/*.launch.py",
    "**/scripts",
    "**/setup.py",
]

[tool.ruff.lint]
exclude = [
    "**/tests/**",
    "**/test/**",
]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI"]
ignore = ["E501", "E402", "F841", "E731", "PYI051", "E741", "UP035"]

[tool.ruff.lint.isort]
known-first-party = [
    "arena_assets",
    "arena_auditory",
    "arena_cli",
    "arena_evaluation",
    "arena_hearing",
    "arena_isaac",
    "arena_mujoco",
    "arena_training",
    "flatsim",
    "isaac_utils",
]

[tool.ruff.lint.per-file-ignores]
"arena_simulation_setup/**/*.py" = ["UP"]
"utils/arena_rclpy_mixins/**/*.py" = ["UP046", "UP047"]
"_meta/arena_cli/__main__.py" = ["UP036"]
"_meta/typings/**/*.pyi" = ["ANN401"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
stubPath = "_meta/typings"
extraPaths = [
    "_meta",
    "arena_assets/src",
    "arena_auditory/arena_auditory",
    "arena_bringup",
    "arena_evaluation/arena_evaluation",
    "arena_hearing/arena_hearing",
    "arena_isaac/arena_isaac",
    "arena_mcp",
    "arena_mujoco/arena_mujoco",
    "arena_planners/arena_planners",
    "arena_robots/arena_robots",
    "arena_runtime/arena_runtime",
    "arena_simulation_setup/src",
    "arena_training",
    "flatsim/flatsim",
    "humansim/arena_humansim",
    "task_generator",
    "utils/arena_cam",
    "utils/arena_rclpy_mixins",
    "utils/arena_viz",
    "utils/human_steering",
    "utils/rerun_utils",
    "utils/rviz_utils",
]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "**/build",
    "**/install",
    "**/log",
    "**/deps",
    "**/tests",
    "**/test",
    "arena_tools",
    "arena_planners/planners",
]
reportMissingModuleSource = "none"
reportPrivateImportUsage = "none"
executionEnvironments = [
    { root = "arena_isaac/arena_isaac", reportMissingImports = "none" },
    { root = "arena_assets/src/arena_assets/utils/ModelConverter", reportMissingImports = "none" },
    { root = "arena_assets/blender/arena_assets_blender", reportMissingImports = "none" },
    { root = "_meta" },
    { root = "arena_assets/src" },
    { root = "arena_auditory/arena_auditory" },
    { root = "arena_bringup" },
    { root = "arena_evaluation/arena_evaluation" },
    { root = "arena_hearing/arena_hearing" },
    { root = "arena_mcp" },
    { root = "arena_mujoco/arena_mujoco" },
    { root = "arena_planners/arena_planners" },
    { root = "arena_robots/arena_robots" },
    { root = "arena_runtime/arena_runtime" },
    { root = "arena_simulation_setup/src" },
    { root = "arena_training" },
    { root = "flatsim/flatsim" },
    { root = "humansim/arena_humansim" },
    { root = "task_generator" },
    { root = "utils/arena_cam" },
    { root = "utils/arena_rclpy_mixins" },
    { root = "utils/arena_viz" },
    { root = "utils/human_steering" },
    { root = "utils/rerun_utils" },
    { root = "utils/rviz_utils" },
    { root = "." },
]
