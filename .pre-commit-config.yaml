repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [.]
        pass_filenames: false
        always_run: true
      - id: ruff-format
        args: [--diff, .]
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: basedpyright
        name: type check
        entry: basedpyright --pythonpath /opt/venv/bin/python3
        language: python
        additional_dependencies: [basedpyright==1.40.2]
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: doc-links
        name: check doc links
        entry: python _meta/tools/check_doc_links.py
        language: python
        pass_filenames: false
        always_run: true
      - id: param-census
        name: check parameter and launch argument declarations
        entry: python utils/arena_rclpy_mixins/arena_rclpy_mixins/arena_rclpy_mixins/census.py
        language: python
        pass_filenames: false
        always_run: true
      - id: uv-workspace-lock
        name: relock uv workspace
        entry: python _meta/tools/uv_workspace.py hook
        language: python
        files: (^|/)(pyproject\.toml|setup\.py)$
        pass_filenames: false
      - id: uv-workspace
        name: check uv workspace manifests
        entry: python _meta/tools/uv_workspace.py check
        language: python
        pass_filenames: false
        always_run: true
