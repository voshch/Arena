# What the dispatcher manages in mechanisms_doorway: world doors by name (their level is the fleet's level, each door's
# polygon is the smallest world zone holding its span), and the world zones goals are drawn in.
world: mechanisms_doorway
resources:
  - id: main_door
    kind: door
  - id: side_door
    kind: door
goal_zones: [east_mid, east_queue, east_north]
