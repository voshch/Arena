[project]
name = "rerun_utils"
version = "0.0.0"
dependencies = [
    "numpy",
    "rerun-sdk>=0.38",
]
dynamic = ["description", "license", "maintainers", "scripts", "entry-points"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]
