[project]
name = "rviz_utils"
version = "0.0.0"
dependencies = [
    "numpy",
    "pyyaml",
]
dynamic = ["authors", "classifiers", "description", "keywords", "license", "maintainers", "scripts"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]
