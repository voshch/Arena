[project]
name = "human_steering"
version = "0.0.0"
dependencies = []
dynamic = ["description", "license", "maintainers"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]
