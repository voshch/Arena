# Arena project settings, adapted from arena-codex-setup.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Compact early enough to preserve project memory, modified files, test results,
# active processes, and repository constraints in the continuation summary.
model_auto_compact_token_limit = 160000

compact_prompt = """
Summarize the session for continuation. Always retain:
- memory files consulted (.codex/arena-memory/*) and the facts taken from them
- files modified, with path and purpose
- test/build results and remaining failures
- processes and simulator envs left running that still need cleanup
- active constraints from AGENTS.md and CLAUDE.md when present
Drop exploratory dead ends and raw tool output.
"""

