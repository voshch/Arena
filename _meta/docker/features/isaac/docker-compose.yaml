services:
  isaac:
    image: "arena_isaac:${ARENA_IMAGE_TAG}"
    pull_policy: "never"
    build:
      context: ${ARENA_WS_DIR}
      dockerfile: src/Arena/_meta/docker/features/isaac/Dockerfile
    volumes:
      - "${ARENA_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "shared:/tmp/shared"
      - "$HOST_ARENA_WS_DIR/src/Arena/.venv:/opt/venv"
      - "$HOST_ARENA_WS_DIR/src:/opt/arena_ws/src"
      - "$HOST_ARENA_WS_DIR/build:/opt/arena_ws/build"
      - "$HOST_ARENA_WS_DIR/install:/opt/arena_ws/install"
      - "$HOST_ARENA_WS_DIR/log:/opt/arena_ws/log"
      - "$HOST_ARENA_WS_DIR/.env:/opt/arena_ws/.env"
      - "$HOST_ARENA_DATA_DIR:/opt/arena_ws/data"
      - "$HOST_ARENA_SCREENSHOTS_DIR:/opt/arena_ws/screenshots"
      - "$HOST_ARENA_SCREENSHOTS_DIR:/root/Documents/Kit/shared/screenshots"
    environment:
      - DISPLAY
      - TMPDIR=/tmp/shared
      - OMNICLIENT_HUB_MODE=disabled
      - GLIBC_TUNABLES=glibc.rtld.dynamic_sort=1
      - QT_X11_NO_MITSHM=1
      - UV_LINK_MODE=copy
      - AMENT_CMAKE_VENV_UV_OVERRIDES=/opt/arena_ws/src/Arena/_meta/docker/uv-overrides.txt
      - ARENA_IMAGE
      - ARENA_IMAGE_TAG
      - ARENA_PROJECT_NAME
      - ARENA_ROS_DISTRO
      - HOST_UID
      - HOST_ARENA_WS_DIR
      - HOST_ARENA_DATA_DIR
      - HOST_ARENA_SCREENSHOTS_DIR
      - ARENA_DATA_DIR=/opt/arena_ws/data
      - ARENA_SCREENSHOTS_DIR=/opt/arena_ws/screenshots
      - HF_HOME=/opt/arena_ws/data/hf
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - LLM_API_ENDPOINT
    env_file:
      - ${ARENA_WS_DIR}/.env
    userns_mode: ${ARENA_USERNS_MODE:-}
    stdin_open: true
    tty: true
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
