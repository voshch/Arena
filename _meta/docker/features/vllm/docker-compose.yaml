services:
  vllm:
    image: docker.io/vllm/vllm-openai:latest
    network_mode: host
    ipc: host
    volumes:
      - vllm-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-0.6B}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME:-qwen}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.4}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
      - --dtype=${VLLM_DTYPE:-auto}
      - --port=${VLLM_PORT:-8000}
      - --reasoning-parser=${VLLM_REASONING_PARSER:-qwen3}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${VLLM_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8760h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  vllm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    network_mode: host
    depends_on: [vllm]
    volumes:
      - $HOST_ARENA_WS_DIR/src/Arena/_meta/docker/features/vllm/litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "${VLLM_PROXY_PORT:-4000}"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:${VLLM_PROXY_PORT:-4000}/health/liveliness\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  vllm-cache:
