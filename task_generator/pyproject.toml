[project]
name = "task_generator"
version = "0.0.0"
dependencies = [
    "attrs",
    "chromadb",
    "filelock",
    "google-genai",
    "numpy",
    "openai",
    "pyyaml",
    "rospkg",
    "shapely",
    "tqdm",
    "transformers>=5.5.4",
    "typing-extensions",
    "watchdog",
]
dynamic = ["description", "license", "maintainers", "scripts", "entry-points"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
    "network: hits the live upstream host",
]
