# Per clip: loop (else one-shot, parks on the last frame), reverse (loop out and back, for a clip whose end
# does not meet its start) and the joints it drives (omitted = whole body).
# Masks are authored by body group: capture noise and twist wraps make per-joint motion a poor guide.

_upper_body: &upper_body
  - r_waist
  - y_waist
  - waist
  - r_spine
  - y_spine
  - spine
  - r_chest
  - y_chest
  - chest
  - r_head
  - y_head
  - p_head
  - l_y_collar
  - l_p_collar
  - l_y_shoulder
  - l_p_shoulder
  - l_r_shoulder
  - l_elbow
  - r_y_collar
  - r_p_collar
  - r_y_shoulder
  - r_p_shoulder
  - r_r_shoulder
  - r_elbow

beckon: {loop: true, joints: *upper_body}
collapse_to_ground: {loop: false}
hug: {loop: true, joints: *upper_body}
jump: {loop: false}
shake_hand: {loop: true, joints: *upper_body}
sit: {loop: false}
t-pose: {loop: false}
talk_with_arm_gesture: {loop: true, reverse: true, joints: *upper_body}  # the ends are 0.67 m apart: ping-pong instead of a cut
wave: {loop: true, joints: *upper_body}
wave_high: {loop: true, joints: *upper_body}

# Hero-figure copies written by data/recordings/hero_anim/make_hero_clips.py. The originals above are untouched.
# The contact copies turn the forearm, so their masks also carry the wrist pair.
_upper_body_wrists: &upper_body_wrists [r_waist, y_waist, waist, r_spine, y_spine, spine, r_chest, y_chest, chest, r_head, y_head, p_head, l_y_collar, l_p_collar, l_y_shoulder, l_p_shoulder, l_r_shoulder, l_elbow, l_r_wrist, l_wrist, r_y_collar, r_p_collar, r_y_shoulder, r_p_shoulder, r_r_shoulder, r_elbow, r_r_wrist, r_wrist]
beckon_v2: {loop: true, joints: *upper_body}
hug_v2: {loop: true, joints: *upper_body_wrists}
shake_hand_v2: {loop: true, joints: *upper_body_wrists}
beckon_v3: {loop: true, joints: *upper_body_wrists}
shake_hand_v3: {loop: true, joints: *upper_body_wrists}
