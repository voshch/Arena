[project]
name = "arena_runtime"
version = "0.0.0"
dependencies = [
    "attrs",
    "matplotlib",
    "numpy",
    "pillow",
    "pydantic",
    "pyyaml",
    "scipy",
    "shapely",
    "typing-extensions",
]
dynamic = ["description", "license", "maintainers", "scripts", "entry-points"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
    "clips(*names): needs these Animation assets (skipped when they cannot be resolved)",
    "network: hits the live upstream host",
]
