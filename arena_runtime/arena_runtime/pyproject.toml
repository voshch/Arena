[project]
name = "arena_runtime"
version = "0.0.0"
dependencies = [
    "attrs",
    "pyyaml",
]
dynamic = ["description", "license", "maintainers", "scripts"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]
