# Robot contact with a held assistive device, crossing: the robot drives across the path of a blind long-cane user (two-point touch) at 90 degrees, from the
# person's left. The person does not react to robots, and the sweeping cane touches the robot first (humansim robot_contacts).
# Record with --start-within 4.2: the robot starts when the person is 4.2 m away, timed so it meets the device.
format: arena-scenario/2
humans:
- {name: white_cane, model: Common/casual_female_caucasian_middleage_whitecane, pose: [20.5, 11.65, 3.1416], waypoints: [[9.5, 11.65, 0.0]], waypoint_mode: once, agent: {agent_type: ./blind_white_cane_unaware.yaml}}
robots:
- start: [15.0, 10.05, 1.5708]
  phases:
  - {goto: [15.0, 14.65, 1.5708]}
