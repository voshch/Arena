name: waver_2
mode: behavior_tree
extends: adult

initial_sequence: wave_seq

sequences:
  wave_seq:
    steps:
      notice_delay:
        duration: {mean: 3.5, std: 0.3}
      do_wave:
        interaction: WAVE_AT
        attention:
          clip: {name: wave, when: bound}
          gaze: partner
        duration: {mean: 3.0, std: 0.0}
      watch_point:
        attention:
          gaze: partner
        duration: {mean: 1.5, std: 0.2}
      walk_to_meet:
        kind: go_to
        target_pose: {x: 13.5, y: 10.0}
      settle_before_talk:
        duration: {mean: 1.5, std: 0.3}
      do_talk:
        interaction: TALK_TO
        attention:
          gaze: partner
        duration: {mean: 1000.0, std: 0.0}
    then: wave_seq
