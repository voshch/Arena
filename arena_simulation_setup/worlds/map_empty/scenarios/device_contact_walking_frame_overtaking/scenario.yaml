# Robot contact from behind: the robot catches up with a patient with a walking frame walking at its own pace (0.17 m/s) away from it. The person does not react
# to robots, and the robot touches their body, not the walking frame held ahead of them (humansim robot_contacts, part body).
# Record with the default --drive 0.4: the robot gains on the person from 2 m behind.
# There is no walking-frame character: record with --props walking_frame to draw the frame in Isaac Sim.
format: arena-scenario/2
humans:
- {name: walking_frame, model: Hospital/patient_female_asian_old, pose: [20.5, 11.5, 3.1416], waypoints: [[9.5, 11.5, 0.0]], waypoint_mode: once, agent: {agent_type: ./patient_walking_frame_unaware.yaml}}
robots:
- start: [22.5, 11.5, 3.1416]
  phases:
  - {goto: [9.0, 11.5, 3.1416]}
