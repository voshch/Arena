# Robot contact from behind: the robot catches up with an older adult pushing a rollator walking slowly (0.25 m/s) away from it. The person does not react
# to robots, and the robot touches their body, not the rollator held ahead of them (humansim robot_contacts, part body).
# Record with the default --drive 0.4: the robot gains on the person from 2 m behind.
format: arena-scenario/2
humans:
- {name: rollator, model: Common/casual_male_caucasian_old_rollator, pose: [20.5, 11.5, 3.1416], waypoints: [[9.5, 11.5, 0.0]], waypoint_mode: once, agent: {agent_type: ./elder_rollator_slow_unaware.yaml}}
robots:
- start: [22.5, 11.5, 3.1416]
  phases:
  - {goto: [9.0, 11.5, 3.1416]}
