# Robot contact from behind: the robot catches up with a blind long-cane user (two-point touch) walking slowly (0.25 m/s) away from it.
# The person does not react to robots, and the robot touches their body, not the device held ahead of them.
# Run: arena launch sim:=gazebo world:=map_empty robot:=jackal human:=arena tm_robots:=scenario tm_obstacles:=scenario \
#        task.scenario.file:=device_contact_white_cane_overtaking robot.mobile:=test-collision robot.mobile.linear_x:=0.4 task.episode.fail_on_collision:=true
# The robot drives straight ahead; the collision tracker reports the first contact on <robot>/collision_events (kind
# `device` for the held device, `pedestrian` for the body), which ends the episode. With a planner instead of
# test-collision the scenario checks whether it keeps clear. record.dir:=... records it, `arena cam` films it.
format: arena-scenario/2
humans:
- {name: white_cane, model: Common/casual_female_caucasian_middleage_whitecane, pose: [20.5, 11.65, 3.1416], waypoints: [[9.5, 11.65, 0.0]], waypoint_mode: once, agent: {agent_type: ../device_contact_white_cane/blind_white_cane_unaware.yaml, desired_velocity: 0.25}}
robots:
- start: [22.5, 11.65, 3.1416]
  phases:
  - {goto: [9.0, 11.65, 3.1416]}
