# Robot contact with a held assistive device, crossing: the robot drives across the path of an older adult pushing a rollator at 90 degrees, from the
# person's left. The person does not react to robots, and the robot touches the side of the rollator first (humansim robot_contacts).
# Record with --start-within 3.05: the robot starts when the person is 3.05 m away, timed so it meets the device.
format: arena-scenario/2
humans:
- {name: rollator, model: Common/casual_male_caucasian_old_rollator, pose: [20.5, 11.5, 3.1416], waypoints: [[9.5, 11.5, 0.0]], waypoint_mode: once, agent: {agent_type: ./elder_rollator_unaware.yaml}}
robots:
- start: [15.0, 9.9, 1.5708]
  phases:
  - {goto: [15.0, 14.5, 1.5708]}
