# Hug (hug_v7_air_*): office_female_caucasian_young + worker_male_asian_middleage, dyad separation 0.3126 m; designed against the skinned meshes (over-under arms,
# heads side by side, no interpenetration). The head pose is part of the clip, so no gaze override.
name: hugger_w
mode: behavior_tree
extends: adult
initial_sequence: seq
sequences:
  seq:
    steps:
      settle:
        duration:
          mean: 1.0
          std: 0.0
      interact:
        interaction: HUG
        formation_spec:
          type: dyad
          anchor_kind: centroid
          params:
            separation: 0.3126
        attention:
          clip:
            name: hug_v7_air_w
            when: bound
        duration:
          mean: 10000.0
          std: 0.0
    then: seq
