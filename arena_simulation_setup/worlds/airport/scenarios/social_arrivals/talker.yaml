# Conversation pair; the 1.8 m gap between them comes from their spawn poses (TALK_TO does not move them):
# a gap wide enough to drive through, which the social layer must keep closed.
name: talker
mode: behavior_tree
extends: adult
initial_sequence: seq
sequences:
  seq:
    steps:
      settle:
        duration: {mean: 1.0, std: 0.0}
      interact:
        interaction: TALK_TO
        attention:
          gaze: partner
        duration: {mean: 10000.0, std: 0.0}
    then: seq
