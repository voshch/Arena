robots:
  - start: [27.0, -1.5, 1.5708]
    goal: [33.0, 20.0, 0.0]

dynamic:
  - name: receptionist
    model: Office/office_female_caucasian_young
    pose: reception
    agent: {agent_type: ./colleague.yaml, desired_velocity: 1.2}

  - name: analyst
    model: Office/office_male_asian_middleage
    pose: main_office
    agent: {agent_type: ./colleague.yaml, desired_velocity: 1.0}

  - name: manager
    model: Office/office_male_caucasian_middleage
    pose: executive_office_1
    agent: {agent_type: ./colleague.yaml, desired_velocity: 1.4}

  - name: cafeteria_regular
    model: Office/office_female_african_young
    pose: cafeteria
    agent: {agent_type: ./colleague.yaml, desired_velocity: 1.0}

  - name: visitor_1
    model: Office/office_male_african_young
    pose: {x: 31.5, y: -2.0}
    agent: {agent_type: ./colleague.yaml, desired_velocity: 1.1}

  - name: visitor_2
    model: Office/office_female_asian_young
    pose: {x: 32.0, y: -1.5}
    agent: {agent_type: ./colleague.yaml, desired_velocity: 0.9}

  - name: visitor_3
    model: Office/office_male_caucasian_young
    pose: {x: 32.5, y: -2.0}
    agent: {agent_type: ./colleague.yaml, desired_velocity: 1.0}

  - name: courier
    model: Office/office_male_african_middleage
    pose: storage
    agent: {agent_type: adult, desired_velocity: 1.3}
    waypoints:
      - main_hallway
      - reception
      - main_hallway
      - storage

static:
  - name: reception_desk
    model: Office/SM_ReceptionStandA
    pose: reception
    type: desk
    capacity: 3
    interaction_radius: 1.0
    formation:
      type: line
      params: {base_step: 0.8, front_offset: 0.6}

  - name: gathering_area
    type: gathering_area
    model: Office/Sofa
    pose: [6.0, 5.0, 0.0]
    capacity: 0
    formation:
      type: f_formation
      anchor: {kind: object, ref: gathering_area}
      params: {base_radius: 0.8, radius_per_member: 0.12}

  - name: fountain
    type: fountain
    model: Office/Water_Cooler
    pose: [10.5, 5.0, 3.1416]
    capacity: 1
    satisfies: {thirst: 100.0}
    formation:
      type: line
      params: {base_step: 1.0, front_offset: 0.8}

  - name: meeting_chair_1
    model: Office/Chair_Office
    pose: meeting_room_1
    type: chair
    capacity: 1
    interaction_radius: 0.8

  - name: workstation_1
    model: Office/Stand_Table_Work
    pose: main_office
    type: desk
    capacity: 1
    interaction_radius: 1.2

regions:
  visitor_entrance:
    type: source
    polygon:
      - {x: 29.0, y: -2.5}
      - {x: 32.0, y: -2.5}
      - {x: 32.0, y: -1.5}
      - {x: 29.0, y: -1.5}
    config:
      rate_profile:
        - {t: 0.0, rate: 0.1}
        - {t: 30.0, rate: 0.3}
      max_concurrent: 4
      max_total: 15
      agent:
        agent_type: ./colleague.yaml
        desired_velocity: {min: 1.0, max: 1.5}
        sink_affinity:
          - {sink: cafeteria_sink, weight: 1.0}

  cafeteria_sink:
    type: sink
    polygon:
      - {x: 1.0, y: 1.0}
      - {x: 4.0, y: 1.0}
      - {x: 4.0, y: 4.0}
      - {x: 1.0, y: 4.0}
    config:
      capacity: 8
