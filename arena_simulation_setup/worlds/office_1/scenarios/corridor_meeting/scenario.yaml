# Office hallway (office_1): the robot patrols the main hallway westward, past a handshake, a group conversation, greeting colleagues and
# walkers; a woman in the cafeteria opening beckons it (patrol mode perceives the call once it has line of sight through the opening).
# World frame (the env sits at +5, +5 in the map frame).
robots:
- start:
  - 17.0
  - 11.7
  - 3.14159
  phases:
  - goto:
    - 12.5
    - 11.7
    - 3.14159
