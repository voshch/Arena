zones:
  - name: corridor_south
    description: Southern corridor, traversed westbound
    corners:
      - [0.0, 0.0]
      - [10.0, 0.0]
      - [10.0, 3.0]
      - [0.0, 3.0]
    ceiling: false
    walls:
      - start: {x: 0.0, y: 0.0}
        end: {x: 10.0, y: 0.0}
      - start: {x: 3.0, y: 3.0}
        end: {x: 10.0, y: 3.0}
      - start: {x: 10.0, y: 0.0}
        end: {x: 10.0, y: 13.0}
      - start: {x: 0.0, y: 0.0}
        end: {x: 0.0, y: 13.0}
    doors: []
    elevators: []
    entities:
      static: []
      dynamic: []

