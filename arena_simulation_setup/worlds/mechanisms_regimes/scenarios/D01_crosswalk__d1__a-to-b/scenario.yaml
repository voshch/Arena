format: arena-scenario/2
objects:
- {name: far_curb_e, model: Common/Object/painting_1, pose: [21.7, 6.0, 3.1416], humansim: {type: far_curb_e}}
humans:
- {name: xwaiter_1, model: casual_female_caucasian_young, pose: [9.2, 5.2, 0.0], agent: {agent_type: ./signal_waiter.yaml}}
- {name: xwaiter_2, model: worker_male_caucasian_young, pose: [9.2, 6.0, 0.0], agent: {agent_type: ./signal_waiter.yaml}}
- name: cart_1
  model: Hospital/doctor_male_caucasian_middleage
  pose: [11.0, 1.0, 1.5708]
  agent: {agent_type: adult, desired_velocity: 1.3}
  waypoints: [[11.0, 1.0], [11.0, 11.0]]
  waypoint_mode: reverse
robots:
- start: [3.0, 6.0, 0.0]
  phases:
  - {goto: [19.0, 6.0, 0.0]}
conditions:
- {op: eventually, p: robot in x_east, text: Cross the lane.}
