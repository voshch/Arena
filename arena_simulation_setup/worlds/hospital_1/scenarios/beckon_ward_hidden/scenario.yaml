robots:
- start:
  - 10.0
  - 2.0
  - 1.5708
  phases:
  - loop:
    - goto:
      - 10.0
      - 18.0
      - 1.5708
      tolerance_radius: 1.2
    - goto:
      - 10.0
      - 2.0
      - -1.5708
      tolerance_radius: 1.2
    until: robot sees caller within 12 and caller plays beckon for 0.5 or robot within 2.5 of caller
  - goto: caller
    tolerance_radius: 2.5
    hold_time: 0.0
dynamic:
- name: caller
  model: Office/office_female_caucasian_young
  pose:
  - 6.0
  - 15.0
  - 0.0
  agent:
    agent_type: ./caller.yaml
  waypoints:
  - - 6.0
    - 15.0
