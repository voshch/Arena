# Showcase: interaction contract enhancements
#
# Use case 1 — Nurse escort: nurse agent advertises FOLLOW, patient accepts.
#              Shared contract duration ensures coordinated teardown.
# Use case 2 — Doctor consultation: doctor and patient engage in TALK_TO with
#              shared contract duration. Outcome propagates to behavior tree.
# Use case 3 — Reception queue: patients QUEUE_USE at reception desk.
#              If a participant leaves, others see INTERRUPTED outcome.

robots:
  - start: [10.0, 0.5, 1.5708]
    goal: [4.0, 17.6, 0.0]

dynamic:
  # --- Use case 1: nurse escort ---
  - name: nurse_1
    model: Hospital/nurse_female_caucasian_young
    pose: central_hallway
    agent: {agent_type: ./nurse.yaml, desired_velocity: 1.5}
    waypoints:
      - patient_ward
      - central_hallway

  - name: escort_patient
    model: worker_male_caucasian_young
    pose: patient_ward
    agent: {agent_type: ./escort_patient.yaml, desired_velocity: 0.9}
    waypoints:
      - patient_ward

  # --- Use case 2: doctor consultation ---
  - name: doctor_1
    model: Hospital/doctor_male_caucasian_middleage
    pose: exam_room_1
    agent: {agent_type: ./doctor.yaml, desired_velocity: 1.4}
    waypoints:
      - exam_room_1
      - patient_ward
      - exam_room_1

  - name: consult_patient
    model: Office/office_female_caucasian_young
    pose: waiting_area
    agent: {agent_type: ./patient.yaml, desired_velocity: 1.0}
    waypoints:
      - central_hallway
      - exam_room_1

  # --- Use case 3: reception queue ---
  - name: queue_patient_1
    model: worker_male_asian_middleage
    pose: {x: 9.5, y: 0.5}
    agent: {agent_type: ./queue_patient.yaml, desired_velocity: 1.1}
    waypoints:
      - {x: 4.0, y: 1.0}

  - name: queue_patient_2
    model: Office/office_female_caucasian_young
    pose: {x: 10.0, y: 0.8}
    agent: {agent_type: ./queue_patient.yaml, desired_velocity: 0.9}
    waypoints:
      - {x: 4.7, y: 1.0}

  - name: queue_patient_3
    model: worker_male_african_young
    pose: {x: 10.5, y: 0.5}
    agent: {agent_type: ./queue_patient.yaml, desired_velocity: 1.0}
    waypoints:
      - {x: 5.4, y: 1.0}

  # --- Background flow ---
  - name: doctor_2
    model: Hospital/nurse_female_caucasian_young
    pose: laboratory
    agent: {agent_type: adult, desired_velocity: 1.3}
    waypoints:
      - central_hallway
      - operating_room
      - central_hallway
      - laboratory

static:
  - name: reception_desk
    model: Hospital/Reception_Counter
    pose: reception
    type: desk
    capacity: 3
    interaction_radius: 1.0
    formation:
      type: line
      params: {base_step: 0.8, front_offset: 0.6}

  - name: exam_chair_1
    model: Hospital/Patient_Armchair
    pose: exam_room_1
    type: chair
    capacity: 1
    interaction_radius: 0.8

  - name: patient_bed_1
    model: Hospital/Isolation_Bed
    pose: patient_ward
    type: patient_bed
    capacity: 1
    interaction_radius: 1.2

regions:
  visitor_entrance:
    type: source
    polygon:
      - {x: 9.25, y: 0.2}
      - {x: 10.75, y: 0.2}
      - {x: 10.75, y: 1.2}
      - {x: 9.25, y: 1.2}
    config:
      rate_profile:
        - {t: 0.0, rate: 0.1}
        - {t: 30.0, rate: 0.3}
      max_concurrent: 4
      max_total: 15
      agent:
        agent_type: adult
        desired_velocity: {min: 1.0, max: 1.5}
        sink_affinity:
          - {sink: pharmacy_sink, weight: 1.0}

  pharmacy_sink:
    type: sink
    polygon:
      - {x: 5.8, y: 27.0}
      - {x: 7.5, y: 27.0}
      - {x: 7.5, y: 28.3}
      - {x: 5.8, y: 28.3}
    config:
      capacity: 4
