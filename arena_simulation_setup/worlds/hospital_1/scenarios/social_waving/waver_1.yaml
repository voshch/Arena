name: waver_1
mode: behavior_tree
extends: adult

initial_sequence: wave_seq

sequences:
  wave_seq:
    steps:
      do_wave:
        interaction: WAVE_AT
        attention:
          clip: {name: wave, when: always}
          gaze: partner
        duration: {mean: 6.0, std: 0.0}
      do_point:
        attention:
          point: {at: {x: 10.0, y: 17.0, z: 0.3}}
          gaze: partner
        duration: {mean: 1.5, std: 0.2}
      walk_to_meet:
        kind: go_to
        target_pose: {x: 9.5, y: 17.0}
      do_talk:
        interaction: TALK_TO
        attention:
          gaze: partner
        duration: {mean: 1000.0, std: 0.0}
    then: wave_seq
