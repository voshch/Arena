# Hero figure (fig:intro): every gesture class and both contact clips around the central_hallway x sub_hallway
# junction, with a queue, a conversation and through-traffic behind them. The robot drives up the corridor and
# turns toward the caller.
#
#   A  caller          beckons the robot from the sub-hallway
#   B  shaker_*        handshake held in the corridor's west lane, by the ward door
#   C  guide/visitor   nurse points the visitor at the second ward door
#   D  halter          raises a halt at the robot from the operating-room door
#   background: hug up the corridor, two talkers and a water queue down the sub-hallway, two walkers
robots:
- start: [10.4, 3.5, 1.5708]
  phases:
  - goto: [10.6, 9.5, 1.5708]
  - goto: [13.2, 11.5, 0.0]

dynamic:
- name: caller
  model: Hospital/nurse_female_caucasian_young
  pose: [15.2, 11.6, 3.14159]
  agent: {agent_type: ./caller.yaml}
  waypoints: [[15.2, 11.6]]

- name: shaker_doctor
  model: Hospital/doctor_male_caucasian_middleage
  pose: [8.9, 15.6, 0.0]
  agent: {agent_type: ./shaker.yaml}
  waypoints: [[8.9, 15.6]]
- name: shaker_visitor
  model: arenian
  pose: [9.5, 15.6, 3.14159]
  agent: {agent_type: ./shaker.yaml}
  waypoints: [[9.5, 15.6]]

- name: guide
  model: Hospital/nurse_female_caucasian_young
  pose: [11.2, 19.8, 2.5]
  agent: {agent_type: ./guide.yaml}
  waypoints: [[11.2, 19.8]]
- name: visitor
  model: arenian
  pose: [9.8, 20.6, -0.5]
  agent: {agent_type: ./visitor.yaml}
  waypoints: [[9.8, 20.6]]

- name: halter
  model: arenian
  pose: [11.3, 17.0, -1.5708]
  agent: {agent_type: ./halter.yaml}
  waypoints: [[11.3, 17.0]]

- name: hugger_1
  model: Hospital/nurse_female_caucasian_young
  pose: [9.3, 24.0, 0.0]
  agent: {agent_type: ./hugger.yaml}
  waypoints: [[9.3, 24.0]]
- name: hugger_2
  model: arenian
  pose: [9.85, 24.0, 3.14159]
  agent: {agent_type: ./hugger.yaml}
  waypoints: [[9.85, 24.0]]

- name: talker_1
  model: Hospital/doctor_male_caucasian_middleage
  pose: [18.6, 11.1, 1.5708]
  agent: {agent_type: ./talker.yaml}
  waypoints: [[18.6, 11.1]]
- name: talker_2
  model: arenian
  pose: [18.6, 12.0, -1.5708]
  agent: {agent_type: ./talker.yaml}
  waypoints: [[18.6, 12.0]]

- name: drinker_1
  model: arenian
  pose: [23.8, 11.5, 0.0]
  agent: {agent_type: ./drinker.yaml}
- name: drinker_2
  model: Hospital/nurse_female_caucasian_young
  pose: [22.9, 11.5, 0.0]
  agent: {agent_type: ./drinker.yaml}
- name: drinker_3
  model: arenian
  pose: [22.0, 11.5, 0.0]
  agent: {agent_type: ./drinker.yaml}

- name: walker_1
  model: arenian
  pose: [9.0, 30.0, -1.5708]
  agent: {agent_type: adult, desired_velocity: 1.2}
  waypoints: [[9.0, 30.0], [9.0, 5.0]]
- name: walker_2
  model: Hospital/nurse_female_caucasian_young
  pose: [11.3, 6.0, 1.5708]
  agent: {agent_type: adult, desired_velocity: 1.3}
  waypoints: [[11.3, 6.0], [11.3, 31.0]]

static:
- name: fountain
  type: fountain
  model: Hospital/SM_WaterDispenser_01a
  pose: [24.7, 11.55, 3.14159]
  capacity: 1
  formation:
    type: line
    params: {base_step: 0.9, front_offset: 0.8}
