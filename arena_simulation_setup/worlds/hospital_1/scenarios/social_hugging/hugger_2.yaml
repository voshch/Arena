name: hugger_2
mode: behavior_tree
extends: adult

initial_sequence: hug_seq

sequences:
  hug_seq:
    steps:
      walk_to_meet:
        kind: go_to
        target_pose: {x: 10.5, y: 17.0}
      do_hug:
        interaction: HUG
        attention:
          gaze: partner
        duration: {mean: 1000.0, std: 0.0}
    then: hug_seq
