# Handshake for the video (LOCKED): doctor_male_caucasian_middleage + office_male_caucasian_middleage share one skeleton and are within 3 cm of each
# other in height, so one clip serves both (shake_hand_v7_doctor_pair, palms meet at the midpoint of a 0.88 m dyad).
name: shaker
mode: behavior_tree
extends: adult
initial_sequence: seq
sequences:
  seq:
    steps:
      settle:
        duration:
          mean: 1.0
          std: 0.0
      interact:
        interaction: SHAKE_HAND
        formation_spec:
          type: dyad
          anchor_kind: centroid
          params:
            separation: 0.88
        attention:
          clip:
            name: shake_hand_v7_doctor_pair
            when: bound
          gaze: partner
        duration:
          mean: 10000.0
          std: 0.0
    then: seq
