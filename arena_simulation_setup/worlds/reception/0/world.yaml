zones:
  - description: "Destination zone behind the reception desk"
    name: "destination"
    walls:
      - start: { x: 0.0, y: 0.0 }
        end: { x: 15.0, y: 0.0 }
      - start: { x: 15.0, y: 23.0 }
        end: { x: 0.0, y: 23.0 }
      - start: { x: 0.0, y: 23.0 }
        end: { x: 0.0, y: 0.0 }

    corners:
      - [0.0, 0.0]
      - [15.0, 0.0]
      - [15.0, 23.0]
      - [0.0, 23.0]

    semantics:
      - predicate: restricted
        value: true

    entities:
      static:
        - name: vending_machine
          model: vending_machine
          pose: [7.5, 11.5, 0]

  - description: "Reception Entrance"
    name: "entrance"
    walls:
      - start: { x: 15.0, y: 0.0 }
        end: { x: 15.0, y: 2.0 }
      - start: { x: 15.0, y: 5.0 }
        end: { x: 15.0, y: 23.0 }
      - start: { x: 15.0, y: 0.0 }
        end: { x: 30.0, y: 0.0 }
        kind: painting.yaml
      - start: { x: 15.0, y: 0.0 }
        end: { x: 30.0, y: 0.0 }
        kind: painting.yaml

      - start: { x: 30.0, y: 0.0 }
        end: { x: 30.0, y: 23.0 }
      - start: { x: 30.0, y: 23.0 }
        end: { x: 15.0, y: 23.0 }

    corners:
      - [15.0, 0.0]
      - [30.0, 0.0]
      - [30.0, 23.0]
      - [15.0, 23.0]
    doors:
      - name: "door"
        start: [15.0, 2.0]
        end: [15.0, 5.0]
        height: 2.0
        kind: "sliding"

    semantics:
      - predicate: quiet
        value: true

    entities:
      static:
        - name: nurse_station
          model: Hospital/Reception_Counter
          pose: [15, 11.5, -1.57]
        - name: chair1
          model: Hospital/Chair
          pose: [20.5, 1.0, 1.57]
        - name: chair2
          model: Hospital/Chair
          pose: [21.5, 1.0, 1.57]
        - name: chair3
          model: Hospital/Chair
          pose: [22.5, 1.0, 1.57]
        - name: chair4
          model: Hospital/Chair
          pose: [23.5, 1.0, 1.57]
        - name: chair5
          model: Hospital/Chair
          pose: [24.5, 1.0, 1.57]