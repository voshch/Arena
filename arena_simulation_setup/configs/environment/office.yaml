groups:
  - name: "office_quad_short_tables"
    margin: 3
    size: [4.0, 4.0]      
    rotations: [0, 90]      
    entities:
      static:
        - position: [-2.0,   2.0,   0]
          model: Office/Table_B
        - position: [-2.25,  2.15,  0]
          model: Office/Chair_Office
        - position: [-1.7,   1.25,  180]
          model: Office/Chair_Office

        - position: [ 2.0,   2.0,   0]
          model: Office/Table_B
        - position: [ 1.75,  2.15,  0]
          model: Office/Chair_Office
        - position: [ 2.3,   1.25,  180]
          model: Office/Chair_Office

        - position: [-2.0,  -2.0,   0]
          model: Office/Table_B
        - position: [-2.25, -1.85,  0]
          model: Office/Chair_Office
        - position: [-1.7,  -2.75,  180]
          model: Office/Chair_Office

        - position: [ 2.0,  -2.0,   0]
          model: Office/Table_B
        - position: [ 1.75, -1.85,  0]
          model: Office/Chair_Office
        - position: [ 2.3,  -2.75,  180]
          model: Office/Chair_Office

  - name: "office_horizontal_long_tables"
    margin: 5
    size: [4.0, 4.0]      # Covers both original horizontal tables
    rotations: [0, 90]      # Added 90°
    entities:
      static:
        # ——— Mid Horizontal Table Entities ———
        - position: [ 0.0,   2.0,   90]
          model: Office/Long_Rectangle_Table
        # Chairs along the top side (facing down)
        - position: [-4.0,   3.2,   -90]
          model: Office/Chair_Office
        - position: [-2.0,   3.2,   -90]
          model: Office/Chair_Office
        - position: [ 0.0,   3.2,   -90]
          model: Office/Chair_Office
        - position: [ 2.0,   3.2,   -90]
          model: Office/Chair_Office
        - position: [ 4.0,   3.2,   -90]
          model: Office/Chair_Office
        # Chairs along the bottom side (facing up)
        - position: [-4.0,   0.8, 90]
          model: Office/Chair_Office
        - position: [-2.0,   0.8, 90]
          model: Office/Chair_Office
        - position: [ 0.0,   0.8, 90]
          model: Office/Chair_Office
        - position: [ 2.0,   0.8, 90]
          model: Office/Chair_Office
        - position: [ 4.0,   0.8, 90]
          model: Office/Chair_Office

        - position: [ 0.0,  -2.0,   90]
          model: Office/Long_Rectangle_Table
        # Chairs along the top side (facing down)
        - position: [-4.0,   -0.8,   -90]
          model: Office/Chair_Office
        - position: [-2.0,   -0.8,   -90]
          model: Office/Chair_Office
        - position: [ 0.0,   -0.8,   -90]
          model: Office/Chair_Office
        - position: [ 2.0,   -0.8,   -90]
          model: Office/Chair_Office
        - position: [ 4.0,   -0.8,   -90]
          model: Office/Chair_Office
        # Chairs along the bottom side (facing up)
        - position: [-4.0,  -3.2, 90]
          model: Office/Chair_Office
        - position: [-2.0,  -3.2, 90]
          model: Office/Chair_Office
        - position: [ 0.0,  -3.2, 90]
          model: Office/Chair_Office
        - position: [ 2.0,  -3.2, 90]
          model: Office/Chair_Office
        - position: [ 4.0,  -3.2, 90]
          model: Office/Chair_Office

  - name: "office_quad_short_tables_random"
    margin: 3
    size: [6.0, 6.0] # Adjusted size to encompass the offset sub-groups     
    rotations: [0, 45, 90, 135, 180, 225, 270, 315] # Added more rotation angles    
    entities:
      static:
        # Sub-groups are intentionally offset and rotated from a grid for a more natural layout

        # Sub-group 1 (formerly Top-Left)
        - position: [-2.0,   2.0,   0]
          model: Office/Table_B
        - position: [-2.25,  2.15,  0]
          model: Office/Chair_Office
        - position: [-1.7,   1.25,  180]
          model: Office/Chair_Office

        - position: [ 2.0,   2.0,   0]
          model: Office/Table_B
        - position: [ 1.75,  2.15,  0]
          model: Office/Chair_Office
        - position: [ 2.3,   1.25,  180]
          model: Office/Chair_Office

        - position: [-2.0,  -2.0,   0]
          model: Office/Table_B
        - position: [-2.25, -1.85,  0]
          model: Office/Chair_Office
        - position: [-1.7,  -2.75,  180]
          model: Office/Chair_Office

        - position: [ 2.0,  -2.0,   0]
          model: Office/Table_B
        - position: [ 1.75, -1.85,  0]
          model: Office/Chair_Office
        - position: [ 2.3,  -2.75,  180]
          model: Office/Chair_Office
          
  - name: "office_horizontal_long_tables_random"
    margin: 5
    size: [10.0, 8.0] # Adjusted size to encompass the offset sub-groups
    rotations: [0, 90, 180, 270] # Added more rotation angles
    entities:
      static:
        # Sub-groups (table + chairs) are intentionally offset and rotated from each other

        # ——— Upper Table Sub-group (shifted left, rotated -10 deg) ———
        - position: [-1.0,  2.5,  80]
          model: Office/Long_Rectangle_Table
        # Chairs along the top side
        - position: [-4.7,  4.4, -100]
          model: Office/Chair_Office
        - position: [-2.8,  4.0, -100]
          model: Office/Chair_Office
        - position: [-0.8,  3.7, -100]
          model: Office/Chair_Office
        - position: [ 1.2,  3.3, -100]
          model: Office/Chair_Office
        - position: [ 3.1,  3.0, -100]
          model: Office/Chair_Office
        # Chairs along the bottom side
        - position: [-5.1,  2.0,  80]
          model: Office/Chair_Office
        - position: [-3.2,  1.7,  80]
          model: Office/Chair_Office
        - position: [-1.2,  1.3,  80]
          model: Office/Chair_Office
        - position: [ 0.8,  1.0,  80]
          model: Office/Chair_Office
        - position: [ 2.7,  0.6,  80]
          model: Office/Chair_Office

        # ——— Lower Table Sub-group (shifted right, rotated +15 deg) ———
        - position: [ 1.5, -2.5, 105]
          model: Office/Long_Rectangle_Table
        # Chairs along the top side
        - position: [-2.7, -2.4, -75]
          model: Office/Chair_Office
        - position: [-0.7, -1.9, -75]
          model: Office/Chair_Office
        - position: [ 1.2, -1.3, -75]
          model: Office/Chair_Office
        - position: [ 3.1, -0.8, -75]
          model: Office/Chair_Office
        - position: [ 5.1, -0.3, -75]
          model: Office/Chair_Office
        # Chairs along the bottom side
        - position: [-2.1, -4.7, 105]
          model: Office/Chair_Office
        - position: [-0.1, -4.2, 105]
          model: Office/Chair_Office
        - position: [ 1.8, -3.7, 105]
          model: Office/Chair_Office
        - position: [ 3.7, -3.1, 105]
          model: Office/Chair_Office
        - position: [ 5.7, -2.6, 105]
          model: Office/Chair_Office