  #         model: large_pallet1

  - name: "circle"
    margin: 1
    rotations: [0, 15, 30, 45, 60, 75]
    size: [3, 3] # or compute this otf (as area of obstacles plus some padding)
    entities:
      static:
        - position: [0, -1, 0]
          model: Residential/Wood_Chair
        - position: [0.707, -0.707, 45]
          model: Residential/Wood_Chair
        - position: [1, 0, 90]
          model: Residential/Wood_Chair
        - position: [0.707, 0.707, 135]
          model: Residential/Wood_Chair
        - position: [0, 1, 180]
          model: Residential/Wood_Chair
        - position: [-0.707, 0.707, 225]
          model: Residential/Wood_Chair
        - position: [-1, 0, 270]
          model: Residential/Wood_Chair
        - position: [-0.707, -0.707, 315]
          model: Residential/Wood_Chair

  - name: "cafeteria"
    margin: 1.5
    rotations: [0,180]
    size: [1.5,1.5]
    entities:
      static:
        - position: [0,0,0]
          model: Residential/Side_Table
        - position: [0.5,0,90]
          model: Residential/Wood_Chair
        - position: [0,0.5,180]
          model: Residential/Wood_Chair
        - position: [0,-0.5,0]
          model: Residential/Wood_Chair
        - position: [-0.5,0,-90]
          model: Residential/Wood_Chair

  - name: "residential"
    margin: 5
    rotations: [180]
    size: [2,2]
    entities:
      static:
      - position: [0,0,90]
        model: Residential/Bed_A
      # - position: [3,1,90]
      #   model: residential_chairA
      # - position: [3,-1,90]
      #   model: residential_chairD    
      - position: [2,0,0]
        model: Residential/Coffee_Table_A
      - position: [2,2,0]
        model: Residential/Refrigerators
      - position: [2.5,-0.5,180]
        model: Residential/Sofa_A
      - position: [-1,0,0]
        model: Hospital/Privacy_Curtain_Rail

  - name: "hospital"
    margin: 3
    rotations: [0,180]
    size: [2,2]
    entities:
      static:
      - position: [0,0,0]
        model: Hospital/SM_HospitalBed_01b
      - position: [-0.75,1,0]
        model: Hospital/SM_BedSideTable_01b
      - position: [0,-0.5,90]
        model: Hospital/Privacy_Curtain_Rail

  - name: "outdoor"
    margin: 10
    rotations: [180]
    size: [2,2]
    entities:
      static:
      - position: [0,0,90]
        model: Office/SM_Plant03
