groups:
  - name: "office"
    margin: 3
    size: [1.5, 1.5] # or compute this otf (as area of obstacles plus some padding)
    rotations: [0, 180]
    entities:
      static:
        - position: [0.0, 0.0, 0.0]
          model: Office/Table_Work_Security
        - position: [1, 0, -90]
          model: Office/Chair_Office

  # - name: "study"
  #   rotations: [0, 90, 180, 270]
  #   margin: 3
  #   size: [2, 2] # or compute this otf (as area of obstacles plus some padding)
  #   entities:
