[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena_simulation_setup"
version = "0.1.0"
description = "Non-ROS simulation setup headers for the arena project"
authors = [
    { name="voshch", email="dev@voshch.dev" }
]
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "shapely>=2.0.6",
    "numpy>=1.24",
    "attrs>=24.2.0",
    "PyYAML>=6.0",
    "cattrs>=25.1.1",
    "pydantic>=2.11.5",
    "pillow>=11.2.1",
    "colourings>=0.4.1",
    "aiofiles>=25.1.0",
    "huggingface-hub",
    "mcap",
    "mcap-ros2-support",
    "polars",
    "pyarrow",
    "pycollada",
    "requests",
    "scipy",
    "typing-extensions",
    "usd-core",
]

[project.urls]
Homepage = "https://github.com/voshch/Arena"
Repository = "https://github.com/voshch/Arena"

[tool.uv]
package = false


[tool.setuptools.packages.find]
where = ["."]
include = ["arena_simulation_setup*"]
