name: coverage

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to test merged into jazzy
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/ci
      - id: pick
        run: .github/ci/pick-image.sh

  core:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_MAXSIZE: 500M
      UV_CACHE_DIR: /github/home/.cache/uv
      UV_LINK_MODE: copy
      PACKAGES: arena_evaluation arena_simulation_setup rviz_utils task_generator
      GATED: >-
        arena_evaluation/arena_evaluation/arena_evaluation/processing/metrics
        arena_simulation_setup/src/arena_simulation_setup/shared
        utils/rviz_utils/rviz_utils/hri
        task_generator/task_generator/tasks/registry.py
    steps:
      - run: type -P ccache curl git vcs zstd > /dev/null || { apt-get update && apt-get install -y --no-install-recommends ca-certificates ccache curl git python3-vcstool zstd; }
      - uses: voshch/ci/trial-merge@v1
        id: checkout
        with:
          base: jazzy
          head: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: diff the gated code
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ steps.checkout.outputs.base }}
        run: |
          git config --global --add safe.directory '*'
          base=${BASE:-$BEFORE}
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$base"
          subs=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          : > gated.diff
          for path in $GATED; do
            sub=$(for s in $subs; do case "$path/" in "$s"/*) echo "$s" ;; esac; done)
            if [ -z "$sub" ]; then
              git diff --no-ext-diff "$base" HEAD -- "$path" >> gated.diff
              continue
            fi
            old=$(git rev-parse -q --verify "$base:$sub" || git hash-object -t tree /dev/null)
            git -C "$sub" cat-file -e "$old" 2>/dev/null || git -C "$sub" fetch -q --no-tags --depth=1 origin "$old"
            git -C "$sub" diff --no-ext-diff --src-prefix="a/$sub/" --dst-prefix="b/$sub/" "$old" HEAD -- "${path#"$sub"/}" >> gated.diff
          done
          echo "gated=$([ -s gated.diff ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: fetch the dependency repos
        if: steps.diff.outputs.gated == 'true'
        run: vcs import --shallow --recursive --input _meta/repos/arena.repos .
      - name: install the system dependencies
        if: steps.diff.outputs.gated == 'true'
        run: .github/ci/system-deps.sh $PACKAGES
      - uses: actions/cache@v4
        if: steps.diff.outputs.gated == 'true'
        with:
          path: /github/home/.cache/uv
          key: uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: uv-
      - name: install the locked python dependencies
        if: steps.diff.outputs.gated == 'true'
        run: |
          type -P uv > /dev/null || curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          python3 _meta/tools/uv_workspace.py compose
          uv venv --system-site-packages /opt/venv
          export VIRTUAL_ENV=/opt/venv
          colcon list --packages-up-to $PACKAGES --names-only > upto.txt
          members=$(python3 -c 'import re, tomllib, pathlib; norm = lambda n: re.sub(r"[-_.]+", "-", n).lower(); ws = pathlib.Path(".uv-workspace"); upto = {norm(n) for n in pathlib.Path("upto.txt").read_text().split()}; [print(n) for m in tomllib.load(open(ws / "pyproject.toml", "rb"))["tool"]["uv"]["workspace"]["members"] for n in [tomllib.load(open(ws / m / "pyproject.toml", "rb"))["project"]["name"]] if norm(n) in upto]')
          uv sync --inexact --active --project .uv-workspace $(printf -- '--package %s ' arena-rosnav $members)
          uv pip install coverage diff-cover==10.6.0
      - uses: actions/cache@v4
        if: steps.diff.outputs.gated == 'true'
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ github.workflow }}-
            ccache-
      - name: build the packages
        if: steps.diff.outputs.gated == 'true'
        run: |
          source /opt/ros/jazzy/setup.bash
          export CCACHE_BASEDIR=$GITHUB_WORKSPACE
          colcon build --symlink-install --packages-up-to $PACKAGES --cmake-args -DPython3_EXECUTABLE=/opt/venv/bin/python -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --show-stats
      - name: test the gated code under branch coverage
        if: steps.diff.outputs.gated == 'true'
        run: |
          source install/setup.bash
          export PATH=/opt/venv/bin:$PATH
          sources=$(for p in $GATED; do [ -d "$p" ] && echo "$PWD/$p" || dirname "$PWD/$p"; done | paste -sd,)
          includes=$(for p in $GATED; do [ -d "$p" ] && echo "$p/*" || echo "$p"; done | paste -sd,)
          for pkg in $(colcon list --packages-select $PACKAGES -p); do
            tests=tests/unit
            [ -d "$pkg/$tests" ] || tests=tests
            (cd "$pkg" && coverage run -p --branch --source="$sources" --data-file="$GITHUB_WORKSPACE/.coverage" -m pytest -p no:launch_testing -p no:launch_ros "$tests")
          done
          coverage combine
          coverage xml --include="$includes"
      - name: gate the changed lines
        if: steps.diff.outputs.gated == 'true'
        run: /opt/venv/bin/diff-cover coverage.xml --diff-file gated.diff --branch-coverage --fail-under 90 --show-uncovered
      - name: prune the uv cache
        if: always() && steps.diff.outputs.gated == 'true'
        run: uv cache prune --ci
