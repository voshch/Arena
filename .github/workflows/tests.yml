name: tests

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request to test merged into jazzy
        required: true
  schedule:
    - cron: '0 3 * * 1'

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/ci
      - id: pick
        run: .github/ci/pick-image.sh
      - name: request this week's image
        if: github.event_name == 'push' && steps.pick.outputs.image != steps.pick.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-image.yml --ref jazzy -f missing_only=true

  suites:
    needs: image
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'schedule' }}
    container: ${{ needs.image.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_MAXSIZE: 500M
      UV_CACHE_DIR: /github/home/.cache/uv
      UV_LINK_MODE: copy
      PYTEST_ADDOPTS: ${{ github.event_name == 'schedule' && '-m network' || '' }}
      ARENA_ASSETS_ENDPOINT: ${{ github.event_name != 'schedule' && 'http://127.0.0.1:9' || '' }}
    steps:
      - run: type -P ccache curl git vcs zstd > /dev/null || { apt-get update && apt-get install -y --no-install-recommends ca-certificates ccache curl git python3-vcstool zstd; }
      - uses: voshch/ci/trial-merge@v1
        with:
          base: jazzy
          head: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: fetch the dependency repos
        run: .github/ci/fetch-deps.sh
      - name: list the packages with tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            printf '%s\n' arena_assets arena_evaluation arena_simulation_setup task_generator | tee tested.txt
          else
            .github/ci/tested-packages.sh | tee tested.txt
          fi
      - name: install the system dependencies
        run: .github/ci/system-deps.sh --purge-dropped $(cat tested.txt)
      - uses: actions/cache@v4
        with:
          path: /github/home/.cache/uv
          key: uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: uv-
      - name: install the locked python dependencies
        run: |
          type -P uv > /dev/null || curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          python3 _meta/tools/uv_workspace.py compose
          uv venv --system-site-packages /opt/venv
          export VIRTUAL_ENV=/opt/venv
          members=$(python3 -c 'import re, tomllib, pathlib; norm = lambda n: re.sub(r"[-_.]+", "-", n).lower(); ws = pathlib.Path(".uv-workspace"); tested = {norm(n) for n in pathlib.Path("tested.txt").read_text().split()}; [print(n) for m in tomllib.load(open(ws / "pyproject.toml", "rb"))["tool"]["uv"]["workspace"]["members"] for n in [tomllib.load(open(ws / m / "pyproject.toml", "rb"))["project"]["name"]] if norm(n) in tested]')
          uv sync --inexact --active --project .uv-workspace $(printf -- '--package %s ' arena-rosnav $members)
      - uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ github.workflow }}-
            ccache-
      - name: build the packages
        id: build
        run: |
          source /opt/ros/jazzy/setup.bash
          export PATH=/opt/venv/bin:$PATH
          export CCACHE_BASEDIR=$GITHUB_WORKSPACE
          colcon build --symlink-install --packages-up-to $(cat tested.txt) --cmake-args -DPython3_EXECUTABLE=/opt/venv/bin/python -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --show-stats
      - name: run every test suite
        run: |
          source install/setup.bash
          export PATH=/opt/venv/bin:$PATH
          mkdir -p log/suites
          status=0
          awk '{print NR, $1}' tested.txt | xargs -P "$(nproc)" -L 1 bash -c 'ROS_DOMAIN_ID=$((10 + $0)) colcon --log-base "log/suites/$1" test --packages-select "$1" --event-handlers console_cohesion+ --return-code-on-test-failure > "log/suites/$1.txt" 2>&1 && echo "passed $1" || { echo "failed $1"; exit 1; }' || status=$?
          cat log/suites/*.txt
          exit $status
      - name: list the test results
        if: always()
        run: /opt/venv/bin/colcon test-result --verbose
      - name: check the types
        if: always() && steps.build.outcome == 'success'
        run: |
          source install/setup.bash
          uv pip install --python /opt/venv/bin/python3 "basedpyright==$(grep -oP 'basedpyright==\K[0-9.]+' .pre-commit-config.yaml)"
          /opt/venv/bin/basedpyright --pythonpath /opt/venv/bin/python3 _meta $(colcon list --packages-select $(cat tested.txt) -p)
      - name: prune the uv cache
        if: always()
        run: uv cache prune --ci
